[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plotmeta"
version = "0.1.0"
description = "Embed and extract exact plot data from scientific figures"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "PlotMeta Contributors" }]
keywords = ["scientific", "plotting", "metadata", "reproducibility", "figures"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.optional-dependencies]
matplotlib = ["matplotlib", "numpy"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "matplotlib",
    "numpy",
]
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "sphinx-copybutton",
    "sphinx-autodoc2",
    "myst-parser",
]

[project.urls]
Homepage = "https://github.com/plotmeta/plotmeta-python"
Documentation = "https://plotmeta.github.io/plotmeta-python"
Repository = "https://github.com/plotmeta/plotmeta-python"
Issues = "https://github.com/plotmeta/plotmeta-python/issues"

[project.scripts]
plotmeta = "plotmeta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plotmeta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
